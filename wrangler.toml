name = "binance-market-radar"
main = "_worker.js"
compatibility_date = "2024-09-01"

# 定时触发器 (每 2 分钟定时同步币安各看板数据到 KV)
[triggers]
crons = ["*/2 * * * *"]

# Cloudflare KV 命名空间绑定 (按需开启，未配置时自动使用 Edge Cache 降级模式)
# 创建 KV: npx wrangler kv namespace create BIAN_KV
# 然后将生成的 id 填入下方
[[kv_namespaces]]
binding = "BIAN_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_ID"

[observability]
enabled = true
